[project]
name = "ammrag"
version = "0.1.0"
description = "Agentic Multi-modal RAG service"
authors = [
    { name = "mosewell", email = "michael.sewell@ssc-spc.gc.ca" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "python-dotenv",
    "dotenv",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "qdrant-client[fastembed]",
    "sentence-transformers",
    "transformers",
    "llama-index-core",
    "llama-index-embeddings-huggingface",
    "openai",
    "crewai",
    "crewai[tools]",
    "psycopg2-binary",
    "datasets",
    "tqdm",
    "mmore>=1.1.1",
    "unstructured[all-docs]>=0.18.32",
    "ollama>=0.6.1",
]

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "flake8==7.1.1",
    "mypy==1.13.0",
]
test = [
    "pytest",
    "pytest-asyncio",
]
web = [
    "gradio",
]

[project.scripts]
agents = "src.agents.main:run"
run_crew = "src.agents.main:run"
train = "src.agents.main:train"
replay = "src.agents.main:replay"
test = "src.agents.main:test"
run_with_trigger = "src.agents.main:run_with_trigger"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./qdrant_storage:/qdrant/storage

  ollama:
    container_name: ollama
    image: ollama/ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            capabilities: ["gpu"]
            count: all
    healthcheck:
      test:  [ "CMD-SHELL", "bash", "-c", "{ printf >&3 'GET / HTTP/1.0\\r\\n\\r\\n'; cat <&3; } 3<>/dev/tcp/localhost/11434 | grep 'Ollama is' || exit 1"  ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # frontend:
  #   build:
  #     context: ..
  #     dockerfile: nss/components/frontend/Dockerfile
  #   ports:
  #     - "5173:5173"
  #   command: bash
  #   tty: true

  fileshare: 
    build: utils/fileshare/.
    ports:
      - "8642:8642"
    volumes:
      - /home/mosewell/canchat-v2-nss/nss/data/mmore/input:/app/pub:ro
      
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: supersecret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  # portainer:
  #   image: portainer/portainer-ce:lts
  #   container_name: portainer
  #   ports:
  #     - "8000:8000"
  #     - "9443:9443"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - portainer_data:/data  
  #   restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    # user: "5050:5050"
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8282:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
    ollama:    
    postgres_data:
    pgadmin_data:
    portainer_data:
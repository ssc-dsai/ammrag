  crewai:
    container_name: crewai
    build:
      context: ./crewai/.
    volumes:
      - ./crewai/:/app/
    ports:
      - "5006:5006"
    command: bash
    tty: true

  # mmore:
  #   container_name: mmore
  #   build: 

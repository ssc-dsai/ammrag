  # mmore:
  #   container_name: mmore
  #   build: 
  #     context: ./mmore/mmore_qdrant/.
  #     args:
  #       USER_UID: 1000
  #       USER_GID: 1000 
  #   volumes:
  #     - ./mmore/:/app/config/
  #     - ./data/mmore/:/data/
  #   ports:
  #     - "8000:8000"

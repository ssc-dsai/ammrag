find_tables:
  description: >
    Given the user question: '{question}',
    query index_table to identify relevant tables.
    Return a short list of table names and why each is relevant.
  expected_output: >
    A list of table names with explanations.
  agent: sql_researcher

query_tables:
  description: 
    Using the tables identified previously,
    write SQL queries to answer the question. 
    Focus on trends, declines, and affected products.
  expected_output: >
    Query results and a short analytical summary.
  agent: data_analyst
  context: [find_tables]

synthesize_answer:
  description: 
    Combine all findings into a clear, direct answer to the original question. Avoid SQL jargon.
  expected_output: >
    A human-readable explanation with bullet points.
  agent: data_analyst
  context: [query_tables]


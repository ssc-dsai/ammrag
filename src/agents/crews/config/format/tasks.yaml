answer_synthesis_task:
  description: >
    Write a formatted markdown answer to: "{query}"

    Findings:
    {findings}

    Each finding has a "uri" field — an opaque identifier that will be
    resolved into a real link after your response is processed. Copy every
    URI character-for-character; do not decode, normalise, or alter it.

    Citation numbering rules:
    - Assign n=1 to the first URI you cite, n=2 to the second distinct URI, and so on.
    - Every time you cite the same URI again, reuse its assigned number.
    - Numbers must reflect order of first appearance across the whole document.

    Body formatting rules:
    - Use tables, bullet points, and markdown images where they aid clarity.
    - Append an inline citation immediately after every claim:
        [n](uri)
    - For image URIs (ending in .png .jpg .jpeg .gif .webp .bmp .svg),
      display the image AND cite it on the same line:
        ![short label](uri) [n](uri)

    Reference list rules:
    - Add a divider (---) after the body, then list every cited URI once:
        n. [uri](uri)
    - Order entries by their citation number (order of first appearance).
    - One entry per line — no blank lines between entries.
    - Omit any URI that was not actually cited in the body.

    Content rules:
    - Use only information present in the findings.
    - If the findings do not answer part of the question, say so — do not fabricate.

  expected_output: >
    A markdown answer with inline citations and a numbered reference list.

    Example (id-a and id-b represent whatever URI values appear in the findings):

    The office at 101 Boul Roland-Thérien has floor plans on file. [1](id-b)
    The third floor layout is shown below. [1](id-b)

    ![Floorplan - Floor 3](id-a) [2](id-a)

    ---
    1. [id-b](id-b)
    2. [id-a](id-a)
  agent: answer_synthesizer
